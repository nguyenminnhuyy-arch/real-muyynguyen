name: Muyynguyennn

options:
  bundleIdPrefix: com.muyynguyennn
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO

targets:
  Muyynguyennn:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - App.swift
      - ContentView.swift
      - helpers
      - views
      - kexploit
      - exploit
    resources:
      - Assets.xcassets
      - en.lproj
      - vi.lproj
      - zh-Hans.lproj
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apple.mobile.MobileHouseArrest
        PRODUCT_NAME: Muyynguyennn
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/ThreeOneOSFive-Bridging-Header.h"
        INFOPLIST_FILE: "$(SRCROOT)/Info.plist"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        CURRENT_PROJECT_VERSION: "8"
        MARKETING_VERSION: "2.0.0"
